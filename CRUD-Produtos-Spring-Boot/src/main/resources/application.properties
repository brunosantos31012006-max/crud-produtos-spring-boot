spring.application.name=crud-produtos

# XAMPP: normalmente o usuario e root e a senha fica vazia.
# Se voce configurou uma senha no MySQL, defina a variavel DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/db_produtos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.port=8080
